name: Update Roblox Stats

on:
  schedule:
    - cron: "*/5 * * * *" # every 5 minutes — the shortest interval GitHub reliably honors
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch latest Roblox stats
        run: node scripts/fetch-roblox-stats.mjs

      - name: Commit updated stats file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/roblox-stats.json
          git diff --staged --quiet || git commit -m "chore: update roblox stats"

          # Pull/rebase before pushing in case master moved since checkout
          # (e.g. a manual push or a workflow_dispatch run overlapping this one).
          # This is the only workflow that pushes stats now, but this keeps
          # retries safe instead of failing outright on a race.
          git pull --rebase origin master
          git push
